name: AVEA M13 reversible canary
on:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify repository integrity
        run: |
          git diff --check
          test -n "$(git rev-parse HEAD)"
